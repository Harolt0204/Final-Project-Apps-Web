[project]
name = "thesis-management-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection uses calls in argument defaults by design.
"app/api/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
